{% extends "base.html" %}
{% block title %}Log in · Unfold{% endblock %}

{% block content %}
<section class="card narrow">
  <h1>Welcome back</h1>
  <p class="lead">Log in to continue your check-ins.</p>

  <form method="post">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>

    <button class="btn" type="submit">Log in</button>
  </form>

  <p class="alt">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
